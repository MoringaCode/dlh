#version: "3.9"

services:
  db:
    image: mariadb:${MARIADB_VERSION}
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb_file_per_table=1
    env_file: .env
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - dlh

  redis:
    image: redis:${REDIS_VERSION}
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - dlh

  moodle:
    image: ${APP_IMAGE}
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./dlh:/var/www/html
      - moodledata:/var/www/moodledata
    depends_on:
      - db
      - redis
    networks:
      - dlh

  cron:
    image: ${APP_IMAGE}
    restart: unless-stopped
    depends_on:
      - moodle
    volumes:
      - ./dlh:/var/www/html
      - moodledata:/var/www/moodledata
    entrypoint: >
      sh -c "while true; do
             php admin/cli/cron.php;
             sleep ${CRON_INTERVAL};
           done"
    networks:
      - dlh

  nginx:
    image: nginx:${NGINX_VERSION}
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dlh:/var/www/html
    depends_on:
      - moodle
    networks:
      - dlh

  phpmyadmin:
    image: phpmyadmin:${PHPMYADMIN_VERSION}
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT}:80"
    environment:
      PMA_HOST: ${DB_HOST}
      PMA_PORT: ${DB_PORT}
      UPLOAD_LIMIT: ${PMA_UPLOAD_LIMIT}
    depends_on:
      - db
    networks:
      - dlh

  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION}
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT}:8025"
      - "${MAILPIT_SMTP_PORT}:1025"
    networks:
      - dlh

volumes:
  dbdata:
  moodledata:
  redisdata:

networks:
  dlh:
    driver: bridge